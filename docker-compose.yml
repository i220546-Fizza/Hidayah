# Local development database only. The official pgvector image creates the
# POSTGRES_USER as a superuser, which is what lets migrations run
# "CREATE EXTENSION vector". Do not reuse these settings in production.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hidayah-db
    environment:
      POSTGRES_USER: hidayah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: hidayah
    ports:
      - "127.0.0.1:5432:5432" # reachable from this computer only
    volumes:
      - hidayah-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidayah -d hidayah"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hidayah-db-data:
