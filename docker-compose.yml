# Local development database only. The official pgvector image creates the
# POSTGRES_USER as a superuser, which is what lets migrations run
# "CREATE EXTENSION vector". Do not reuse these settings in production.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hidayah-db
    environment:
      POSTGRES_USER: hidayah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: hidayah
    ports:
      # Host port 5433 -> container port 5432. Many computers already run another
      # PostgreSQL on 5432, so we avoid it. Change HIDAYAH_DB_PORT in .env if 5433 is busy.
      - "127.0.0.1:${HIDAYAH_DB_PORT:-5433}:5432" # reachable from this computer only
    volumes:
      - hidayah-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidayah -d hidayah"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OPTIONAL, throwaway database for running the automated tests quickly.
  # Its data lives in memory (tmpfs) and disappears when the container stops, and it
  # skips disk-sync safety on purpose. It never touches the volume above.
  # Start with:  docker compose --profile test up -d db-test
  db-test:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    container_name: hidayah-db-test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: hidayah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${HIDAYAH_TEST_DB_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidayah -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hidayah-db-data:
